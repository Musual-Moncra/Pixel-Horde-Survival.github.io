<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Pixel Horde Survival">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122044"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="slime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ff0ff"/>
      <stop offset="100%" stop-color="#1fa8d8"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2b3f66" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="480" height="360" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="480" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="477" height="357" rx="23" fill="none" stroke="#2b3f66" stroke-width="3"/>

  <!-- Bầy quái pixel: 3 khối slime xanh -->
  <g transform="translate(56 132) scale(1.5)" fill="url(#slime)" shape-rendering="crispEdges">
    <rect x="16" y="0" width="32" height="8"/>
    <rect x="8" y="8" width="48" height="8"/>
    <rect x="0" y="16" width="16" height="8"/>
    <rect x="24" y="16" width="16" height="8"/>
    <rect x="48" y="16" width="16" height="8"/>
    <rect x="0" y="24" width="64" height="8"/>
    <rect x="0" y="32" width="16" height="8"/>
    <rect x="48" y="32" width="16" height="8"/>
    <rect x="8" y="40" width="48" height="8"/>
  </g>
  <g transform="translate(184 108) scale(2)" fill="#ffd23f" shape-rendering="crispEdges">
    <rect x="16" y="0" width="32" height="8"/>
    <rect x="8" y="8" width="48" height="8"/>
    <rect x="0" y="16" width="16" height="8"/>
    <rect x="24" y="16" width="16" height="8"/>
    <rect x="48" y="16" width="16" height="8"/>
    <rect x="0" y="24" width="64" height="8"/>
    <rect x="0" y="32" width="16" height="8"/>
    <rect x="48" y="32" width="16" height="8"/>
    <rect x="8" y="40" width="48" height="8"/>
  </g>
  <g transform="translate(352 132) scale(1.5)" fill="#ff6b6b" shape-rendering="crispEdges">
    <rect x="16" y="0" width="32" height="8"/>
    <rect x="8" y="8" width="48" height="8"/>
    <rect x="0" y="16" width="16" height="8"/>
    <rect x="24" y="16" width="16" height="8"/>
    <rect x="48" y="16" width="16" height="8"/>
    <rect x="0" y="24" width="64" height="8"/>
    <rect x="0" y="32" width="16" height="8"/>
    <rect x="48" y="32" width="16" height="8"/>
    <rect x="8" y="40" width="48" height="8"/>
  </g>

  <text x="240" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="bold" fill="#ffd23f" letter-spacing="2">PIXEL HORDE</text>
  <text x="240" y="322" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#38d9ff" letter-spacing="12">SURVIVAL</text>
</svg>
